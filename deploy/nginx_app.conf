# /etc/nginx/sites-available/fortuna
#
# Install:
#   ln -sf /etc/nginx/sites-available/fortuna /etc/nginx/sites-enabled/fortuna
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Then let certbot add the TLS listeners and the :80 -> :443 redirect. It edits
# this file in place and keeps everything below:
#   certbot --nginx -d fortunabot.dev -d www.fortunabot.dev

# The old config hardcoded `Connection: upgrade` on every request, including
# ordinary page loads. This sends it only when the client actually asked to
# upgrade, and sends `close` otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name fortunabot.dev www.fortunabot.dev;

    # The dashboard takes OAuth callbacks and small JSON, nothing else. A low
    # cap is free protection against junk uploads.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Add ONLY after certbot has issued a working certificate. HSTS tells
    # browsers to refuse plain HTTP for two years, so turning it on before TLS
    # is proven means a cert problem locks visitors out rather than degrading.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Next fingerprints these filenames, so they can be cached permanently.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
