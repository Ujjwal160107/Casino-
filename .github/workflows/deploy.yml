name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_schema:
        description: "Force the Prisma schema push + catalog seed"
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a run killed mid-rsync
# leaves a half-written release directory, which is worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/fortuna
  SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
  SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

jobs:
  deploy:
    # Must match the VPS's Ubuntu release. We ship prebuilt native modules
    # (node-canvas, the Prisma query engine) and they link against the host's
    # glibc, so a runner/target mismatch fails at runtime, not at build time.
    runs-on: ubuntu-24.04
    environment: production

    services:
      # test/anticheat/* exercises the atomicClaim race fixes against a real
      # Redis. Without one they fail on connect, not on logic.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD~1 for the Prisma change gate

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      # --- build -------------------------------------------------------------

      - name: Install (bot)
        run: npm ci

      - name: Install (dashboard)
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm test

      - name: Build bot
        run: npm run build

      - name: Build dashboard
        working-directory: dashboard
        env:
          # Next evaluates pages at build time, so the build needs the same
          # environment the old on-VPS build got from .env.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: npm run build

      # --- database ----------------------------------------------------------

      - name: Detect Prisma changes
        id: prisma
        run: |
          if [ "${{ inputs.run_schema }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD~1 HEAD -- prisma; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push schema and seed catalogs
        if: steps.prisma.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # No --accept-data-loss. A change that would drop production data has
          # to fail here and be done deliberately, not slip through as a side
          # effect of merging to main.
          npx prisma db push --skip-generate
          npm run seed
          # Idempotent cleanup for players who owned several zoos before the
          # single-slot upgrade ladder. A no-op once none remain.
          npx ts-node src/scripts/collapseMultiZoos.ts

      # --- stage the artifact ------------------------------------------------

      - name: Prune to production dependencies (bot)
        # Drops vitest, ts-node, mongodb-memory-server and puppeteer's ~300MB
        # Chromium from what we ship. postinstall regenerates the Prisma client
        # for both the bot and the dashboard.
        run: npm ci --omit=dev

      - name: Stage release
        run: |
          set -euo pipefail
          mkdir -p stage/dashboard
          # Every image path resolves from __dirname into dist/assets, which
          # `npm run build` populates via copyAssets.js, so src/ never ships.
          cp -r package.json package-lock.json ecosystem.config.js \
                node_modules dist prisma deploy assets stage/
          cd dashboard
          cp -r package.json package-lock.json next.config.ts \
                .next public node_modules ../stage/dashboard/
          # Build cache, not runtime input. Often larger than the app itself.
          rm -rf ../stage/dashboard/.next/cache
          du -sh ../stage

      # --- ship --------------------------------------------------------------

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # A pinned host key rather than ssh-keyscan: trusting whatever answers
          # on every run would let a DNS or route hijack collect the deploy key.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          set -euo pipefail
          RELEASE="${DEPLOY_PATH}/releases/${{ github.sha }}"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_TARGET" "mkdir -p '$RELEASE'"
          # --link-dest hardlinks anything unchanged since the live release, so
          # a typical deploy transfers a few MB instead of the whole tree and
          # old releases cost almost no disk. Omitted on the very first deploy,
          # when there is no `current` to link against yet.
          LINK_DEST=""
          if ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_TARGET" "[ -d '${DEPLOY_PATH}/current' ]"; then
            LINK_DEST="--link-dest=${DEPLOY_PATH}/current"
          fi
          rsync -az --delete $LINK_DEST \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519" \
            stage/ "$SSH_TARGET:$RELEASE/"

      - name: Activate release
        run: |
          set -euo pipefail
          RELEASE="${DEPLOY_PATH}/releases/${{ github.sha }}"
          # The new release activates itself, so release.sh is versioned with
          # the code it deploys. It rolls back on its own if the health gate
          # fails, and exits non-zero so this run goes red either way.
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_TARGET" \
            "chmod +x '$RELEASE/deploy/release.sh' && '$RELEASE/deploy/release.sh' '${{ github.sha }}'"
