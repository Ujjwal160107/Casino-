name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  sync-schema:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Push Prisma schema to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db push --skip-generate
      - name: Seed global catalogs (shop, properties, degrees, stocks)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed
      - name: Collapse legacy multi-zoo owners onto their biggest zoo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Idempotent: cleans up players who owned several zoos before the
        # single-slot upgrade ladder. A harmless no-op once none remain.
        run: npx ts-node src/scripts/collapseMultiZoos.ts

  deploy:
    needs: [build, sync-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Deploy Webhook
        env:
          COMMIT_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          payload=$(jq -n \
            --arg ref "$COMMIT_REF" \
            --arg sha "$COMMIT_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            '{ref: $ref, sha: $sha, message: $message}')
          # --max-time bounds the request: the webhook acknowledges within a
          # second (the real build runs on the VPS afterward), so anything
          # longer means a network/listener problem — fail fast instead of
          # letting the CI run hang. --fail-with-body makes a non-2xx response
          # (e.g. 403 bad secret) fail the step instead of silently passing.
          curl -sS --max-time 30 --fail-with-body -o /dev/null -w "%{http_code}\n" \
            -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -d "$payload"
