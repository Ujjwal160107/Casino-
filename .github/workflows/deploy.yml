name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_schema:
        description: "Force the Prisma schema push + catalog seed"
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a run killed mid-rsync
# leaves a half-written release directory, which is worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/fortuna
  SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
  SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

jobs:
  deploy:
    # Must match the VPS's Ubuntu release. We ship prebuilt native modules
    # (node-canvas, the Prisma query engine) and they link against the host's
    # glibc, so a runner/target mismatch fails at runtime, not at build time.
    runs-on: ubuntu-24.04
    environment: production

    services:
      # test/anticheat/* exercises the atomicClaim race fixes against a real
      # Redis. Without one they fail on connect, not on logic.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD~1 for the Prisma change gate

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      # --- what actually changed? --------------------------------------------

      - name: Detect changes
        id: changed
        run: |
          set -uo pipefail
          # With no baseline -- a manual run, or the first commit -- assume
          # everything changed rather than skip work on an unknown starting point.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            { echo "bot=true"; echo "dashboard=true"; echo "prisma=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { ! git diff --quiet HEAD~1 HEAD -- "$@"; }
          # The dashboard imports the shared Prisma schema, so a schema change
          # invalidates its build too.
          changed dashboard prisma \
            && echo "dashboard=true" >> "$GITHUB_OUTPUT" \
            || echo "dashboard=false" >> "$GITHUB_OUTPUT"
          changed src test prisma package.json package-lock.json \
            && echo "bot=true" >> "$GITHUB_OUTPUT" \
            || echo "bot=false" >> "$GITHUB_OUTPUT"
          changed prisma \
            && echo "prisma=true" >> "$GITHUB_OUTPUT" \
            || echo "prisma=false" >> "$GITHUB_OUTPUT"

      # Restoring a matching .next lets the dashboard build be skipped entirely,
      # which is the single biggest saving here -- next build is minutes, and
      # most pushes never touch the dashboard.
      - name: Cache dashboard dependencies
        id: dash-modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: dash-modules-${{ hashFiles('dashboard/package-lock.json', 'prisma/schema.prisma') }}

      - name: Cache dashboard build
        id: dash-build
        uses: actions/cache@v4
        with:
          path: dashboard/.next
          key: >-
            dash-build-${{ hashFiles(
              'dashboard/src/**', 'dashboard/public/**', 'dashboard/next.config.ts',
              'dashboard/package-lock.json', 'dashboard/tsconfig.json',
              'dashboard/postcss.config.mjs', 'prisma/schema.prisma') }}

      # --- build -------------------------------------------------------------

      - name: Install (bot)
        run: npm ci

      - name: Install (dashboard)
        if: steps.dash-modules.outputs.cache-hit != 'true'
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate slash commands
        # A spec that names a command the router doesn't handle registers fine
        # and then answers "Unknown Command" in production. Catch it here.
        run: npm run validate:slash

      - name: Test
        # The suite covers bot code only. A dashboard-only push cannot affect
        # it, and it is the slowest step here at ~100s.
        if: steps.changed.outputs.bot == 'true'
        env:
          # test/setupEnv.ts wants TEST_REDIS_URL specifically, and copies it into
          # REDIS_URL itself — setting REDIS_URL here does nothing. db 15 matches
          # the convention in .env.test.example.
          # Mongo needs no variable: test/globalSetup.ts starts a memory-server
          # replica set from the Linux mongod that mongodb-memory-server's own
          # postinstall fetched during `npm ci`. MONGOMS_SYSTEM_BINARY is only
          # needed on Windows, where that download is unreliable.
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: npm test

      - name: Build bot
        run: npm run build

      - name: Build dashboard
        # Skipped when the cache already holds a .next built from exactly these
        # sources. This is where most of the pipeline's time used to go.
        if: steps.dash-build.outputs.cache-hit != 'true'
        working-directory: dashboard
        env:
          # Next evaluates pages at build time, so the build needs the same
          # environment the old on-VPS build got from .env.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: npm run build

      # --- database ----------------------------------------------------------

      - name: Push schema and seed catalogs
        if: steps.changed.outputs.prisma == 'true' || inputs.run_schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # No --accept-data-loss. A change that would drop production data has
          # to fail here and be done deliberately, not slip through as a side
          # effect of merging to main.
          npx prisma db push --skip-generate
          npm run seed
          # Idempotent cleanup for players who owned several zoos before the
          # single-slot upgrade ladder. A no-op once none remain.
          npx ts-node src/scripts/collapseMultiZoos.ts

      # --- stage the artifact ------------------------------------------------

      - name: Prune to production dependencies (bot)
        # Drops vitest, ts-node, mongodb-memory-server and puppeteer's ~300MB
        # Chromium from what we ship. `prune` removes them in place rather than
        # reinstalling from scratch as `npm ci --omit=dev` would, and leaves the
        # already-generated Prisma client alone.
        run: npm prune --omit=dev

      - name: Stage release
        run: |
          set -euo pipefail
          mkdir -p stage/dashboard
          # Hardlinks, not copies: same filesystem, and nothing mutates these
          # files afterwards, so staging ~1GB is instant instead of a real copy.
          # src/ is deliberately absent -- every asset lookup now resolves from
          # __dirname into dist/assets via src/utils/assetPaths.ts.
          cp -al package.json package-lock.json ecosystem.config.js \
                 node_modules dist prisma deploy assets stage/
          cd dashboard
          cp -al package.json package-lock.json next.config.ts \
                 .next public node_modules ../stage/dashboard/
          # Build cache, not runtime input. Often larger than the app itself.
          rm -rf ../stage/dashboard/.next/cache
          du -sh ../stage

      # --- ship --------------------------------------------------------------

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # A pinned host key rather than ssh-keyscan: trusting whatever answers
          # on every run would let a DNS or route hijack collect the deploy key.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          set -euo pipefail
          RELEASE="${DEPLOY_PATH}/releases/${{ github.sha }}"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_TARGET" "mkdir -p '$RELEASE'"
          # --link-dest hardlinks anything unchanged since the live release, so
          # a typical deploy transfers a few MB instead of the whole tree and
          # old releases cost almost no disk. Omitted on the very first deploy,
          # when there is no `current` to link against yet.
          LINK_DEST=""
          if ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_TARGET" "[ -d '${DEPLOY_PATH}/current' ]"; then
            LINK_DEST="--link-dest=${DEPLOY_PATH}/current"
          fi
          rsync -az --delete $LINK_DEST \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519" \
            stage/ "$SSH_TARGET:$RELEASE/"

      - name: Activate release
        run: |
          set -euo pipefail
          RELEASE="${DEPLOY_PATH}/releases/${{ github.sha }}"
          # The new release activates itself, so release.sh is versioned with
          # the code it deploys. It rolls back on its own if the health gate
          # fails, and exits non-zero so this run goes red either way.
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_TARGET" \
            "chmod +x '$RELEASE/deploy/release.sh' && '$RELEASE/deploy/release.sh' '${{ github.sha }}'"
